name: Build, Publish and Deploy

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Check out source code repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Docker Buildx for enhanced multi-layer and cache builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 3: Authenticate with GitHub Container Registry (GHCR)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 4: Generate container tags and OCI labels
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable=true,priority=100

      # Step 5: Build and publish container image using GitHub Actions cache
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Remote VPS Deployment
    needs: build-and-push
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      # Step 6: Connect to production VPS via SSH and perform sequential zero-OOM deployment
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/api.fatturafacile.eu

            # Authenticate Docker daemon against GitHub Container Registry on the remote host
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull newest application and worker container images
            docker compose pull app queue_worker scheduler

            # Immediately prune dangling layers to free disk space and reduce OS cache pressure
            docker image prune -f

            # Gracefully stop all active services to reclaim RAM and prevent OOM killer invocations
            docker compose stop queue_worker scheduler app postgres || true

            # Remove existing PostgreSQL container and its bound ephemeral state
            docker compose rm -f -v postgres

            # Launch standalone PostgreSQL container first
            docker compose up -d postgres

            # Poll PostgreSQL availability before starting client containers
            echo "Waiting for PostgreSQL service to be ready..."
            RETRIES=30
            until docker compose exec -T postgres pg_isready -h localhost || [ $RETRIES -eq 0 ]; do
              echo "Awaiting PostgreSQL connection readiness ($RETRIES retries remaining)..."
              sleep 2
              RETRIES=$((RETRIES-1))
            done

            if [ $RETRIES -eq 0 ]; then
              echo "Deployment failed: PostgreSQL service did not become healthy in time."
              exit 1
            fi

            # Start web application container after database port is accepting traffic
            docker compose up -d app

            # Provide PHP-FPM process brief stabilization interval
            sleep 3

            # Clear compiled Laravel configuration and application cache
            docker compose exec -T app php -d memory_limit=256M artisan config:clear
            docker compose exec -T app php -d memory_limit=256M artisan cache:clear

            # Drop database schema, re-run all migrations, and seed initial dataset
            docker compose exec -T app php -d memory_limit=512M artisan migrate:fresh --seed --force

            # Optimize production execution by re-caching configuration, routes, and views
            docker compose exec -T app php -d memory_limit=256M artisan config:cache
            docker compose exec -T app php -d memory_limit=256M artisan route:cache
            docker compose exec -T app php -d memory_limit=256M artisan view:cache

            # Generate Swagger / OpenAPI documentation with increased memory ceiling
            docker compose exec -T app php -d memory_limit=512M artisan l5-swagger:generate

            # Start asynchronous background task workers once migrations and caching finish
            docker compose up -d queue_worker scheduler

            # Clean up obsolete container images older than 24 hours
            docker image prune -af --filter "until=24h"
