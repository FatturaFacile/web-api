name: Release & Deploy Production

# main is the release branch: pushes to main only run CI (erp-ci.yml -> sonar.yml).
# A version tag vX.Y.Z runs the full CI, builds one image, publishes it to GHCR and Docker Hub,
# creates the GitHub release and deploys to production after approval (GitHub Environment "prod").
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions: { }

jobs:
  ci:
    uses: ./.github/workflows/erp-ci.yml
    permissions:
      contents: read
    secrets: inherit

  build:
    name: Build & Push Docker Image
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Registry names must be lowercase (the org is FatturaFacile); Docker Hub repo is fatturafacile/api
      - name: Image names and version
        id: vars
        run: |
          {
            echo "ghcr=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "hub=docker.io/fatturafacile/api"
            echo "version=${GITHUB_REF_NAME#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The production compose file on the VPS pulls ghcr.io/fatturafacile/web-api:latest
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.ghcr }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.ghcr }}:latest
            ${{ steps.vars.outputs.hub }}:${{ steps.vars.outputs.version }}
            ${{ steps.vars.outputs.hub }}:latest
          cache-from: type=gha
          # A failed cache write (e.g. "failed to reserve cache") must not block the release
          cache-to: type=gha,mode=max,ignore-error=true

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --verify-tag --generate-notes

  deploy:
    name: Remote VPS Deployment
    needs: release
    runs-on: ubuntu-24.04
    # Required reviewers are configured on the "prod" environment
    environment:
      name: prod
      url: https://api.fatturafacile.eu
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/api.fatturafacile.eu

            # Authenticate with GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Pull latest application images
            docker compose pull app queue_worker scheduler

            # Free dangling image layers before recreating containers
            docker image prune -f

            # Gracefully stop background workers and application (PostgreSQL keeps running: data is preserved)
            docker compose stop queue_worker scheduler app || true

            # Make sure PostgreSQL is up
            docker compose up -d postgres

            # Poll PostgreSQL availability before starting client containers
            echo "Waiting for PostgreSQL service to be ready..."
            RETRIES=30
            until docker compose exec -T postgres pg_isready -h localhost || [ $RETRIES -eq 0 ]; do
              echo "Awaiting PostgreSQL connection readiness ($RETRIES retries remaining)..."
              sleep 2
              RETRIES=$((RETRIES-1))
            done

            if [ $RETRIES -eq 0 ]; then
              echo "Deployment failed: PostgreSQL service did not become healthy in time."
              exit 1
            fi

            # Launch web application container
            docker compose up -d app

            # Wait for app container to reach stable running state
            echo "Waiting for app container to reach stable running state..."
            APP_RETRIES=20
            until [ "$(docker compose ps --status running -q app)" != "" ] || [ $APP_RETRIES -eq 0 ]; do
              STATUS=$(docker compose ps -a app --format "{{.Status}}")
              echo "Current app status: $STATUS ($APP_RETRIES retries remaining)..."
              if echo "$STATUS" | grep -qi "Restarting"; then
                echo "App container entered crash loop! Dumping logs:"
                docker compose logs --tail=50 app
                exit 1
              fi
              sleep 2
              APP_RETRIES=$((APP_RETRIES-1))
            done

            if [ $APP_RETRIES -eq 0 ]; then
              echo "Timeout waiting for app container to run. Dumping logs:"
              docker compose logs --tail=50 app
              exit 1
            fi

            # Execute cache, migrations (non-destructive) and swagger generation in a single shell session
            docker compose exec -T app sh -c "
              set -e
              php -d memory_limit=256M artisan config:clear
              php -d memory_limit=256M artisan cache:clear
              php -d memory_limit=512M artisan migrate --force
              php -d memory_limit=256M artisan config:cache
              php -d memory_limit=256M artisan route:cache
              php -d memory_limit=256M artisan view:cache
              php -d memory_limit=512M artisan l5-swagger:generate
            "

            # Start worker daemons after migrations and cache generation succeed
            docker compose up -d queue_worker scheduler

            # Housekeeping: prune images older than 24h
            docker image prune -af --filter "until=24h"
