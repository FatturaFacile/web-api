name: Enterprise ERP CI Pipeline

on:
  # First link of the main chain: CI -> SonarCloud (sonar.yml) -> Qodana + deploy (workflow_run)
  push:
    # dev pushes run this pipeline through deploy-dev.yml (workflow_call)
    branches: [ main ]
  pull_request:
    branches: [ main, dev ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-24.04

    # Global environment variables shared across all steps and database connections
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: fatturafacile_test
      DB_USERNAME: ff_admin
      DB_PASSWORD: secret_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      # In-memory Redis store for cache, session state, and rate-limiting testing
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Check out repository under $GITHUB_WORKSPACE, enforcing LF line endings to avoid Pint indentation mismatches
      - name: Checkout Codebase
        uses: actions/checkout@v4

      # Ensure UNIX line endings across all PHP files to prevent false-positive Pint rule violations
      - name: Normalize Line Endings (CRLF to LF)
        run: |
          git config --global core.autocrlf false
          find . -type f -name "*.php" -not -path "./vendor/*" -exec dos2unix {} + 2>/dev/null || true

      # Provision PHP 8.5 runtime with all enterprise extensions; coverage is disabled for fast CI runs
      - name: Setup PHP 8.5 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, xmlreader, redis, bcmath
          coverage: none
          # Swagger and the OpenAPI coverage tests scan the whole API
          ini-values: memory_limit=2G
          tools: composer:v2

      # Validate composer.json and composer.lock consistency
      - name: Validate Composer Configuration
        run: composer validate --strict

      # Determine Composer cache directory for strict immutable caching
      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      # Cache Composer dependencies based on composer.lock hash
      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # Install exact project dependencies according to composer.lock with optimized autoloader
      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction --optimize-autoloader

      # Enforce strict code formatting standards via Laravel Pint (fails on any style violation)
      - name: Run Laravel Pint Code Formatter Check
        run: ./vendor/bin/pint --test

      - name: Larastan
        run: ./vendor/bin/phpstan analyse

        # PostgreSQL runs as a step, not a service: a service cannot pass server options, and about 3600 relations need
      # more lock slots than the default to drop the schema in each parallel test process. tmpfs keeps it in RAM.
      - name: Start PostgreSQL
        run: |
          docker run -d --name ci-postgres -p 5432:5432 --tmpfs /var/lib/postgresql/data:rw \
            -e POSTGRES_DB=fatturafacile_test -e POSTGRES_USER=ff_admin -e POSTGRES_PASSWORD=secret_password \
            postgres:17-alpine -c max_locks_per_transaction=256
          for attempt in $(seq 1 30); do
            docker exec ci-postgres pg_isready -U ff_admin -d fatturafacile_test && exit 0
            sleep 2
          done
          docker logs ci-postgres
          exit 1
      # Prepare environment configuration and execute fresh migrations against PostgreSQL
      - name: Setup Environment & Reset Database (Drop & Recreate)
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate:fresh --force

      # Verify the OpenAPI (Swagger) documentation can be generated, as the deploy does after the build
      - name: Generate Swagger Documentation
        run: |
          php artisan l5-swagger:generate
          test -s storage/api-docs/api-docs.json

      # Verify architectural boundary invariants (Clean Architecture / Domain rules)
      - name: Run Pest Architecture Boundary Tests
        run: ./vendor/bin/pest tests/Architecture --no-coverage

      # Execute comprehensive application test suite in parallel (4 processes)
      - name: Run Pest Test Suite (Parallel)
        run: ./vendor/bin/pest --parallel --processes=4 --compact --no-coverage
