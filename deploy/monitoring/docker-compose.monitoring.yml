services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: ff_uptime_kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "extra/healthcheck"]
      interval: 60s
      timeout: 10s
      retries: 3

volumes:
  uptime_kuma_data:
