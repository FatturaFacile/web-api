# Dev hostnames on the production reverse proxy (erp_nginx): copy to its conf.d as dev.conf.
# TLS ends here; everything is forwarded to ffdev_web (dev stack, see compose.yml in this folder).
# The variable + resolver keep erp_nginx starting even when the dev stack is down.
server {
    listen 80;
    server_name dev.fatturafacile.eu dev-api.fatturafacile.eu inglorious.fatturafacile.eu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.fatturafacile.eu dev-api.fatturafacile.eu;

    ssl_certificate /etc/letsencrypt/live/dev.fatturafacile.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.fatturafacile.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64M;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $ffdev_upstream ffdev_web;
        proxy_pass http://$ffdev_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

# Inglorious frontend: own certificate (certbot certonly --webroot -d inglorious.fatturafacile.eu)
server {
    listen 443 ssl;
    server_name inglorious.fatturafacile.eu;

    ssl_certificate /etc/letsencrypt/live/inglorious.fatturafacile.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inglorious.fatturafacile.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 64M;

    location / {
        resolver 127.0.0.11 valid=10s;
        set $ffdev_upstream ffdev_web;
        proxy_pass http://$ffdev_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}
