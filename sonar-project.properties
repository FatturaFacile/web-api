sonar.projectKey=FatturaFacile_web-api
sonar.organization=fatturafacile

sonar.sourceEncoding=UTF-8
sonar.sources=app,bootstrap,config,database,lang,public,resources,routes,scripts
sonar.tests=tests

sonar.exclusions=**/vendor/**,**/node_modules/**,**/public/build/**,**/public/vendor/**,**/public/storage/**,**/storage/**,**/bootstrap/cache/**,**/clients/**,**/docs/**,**/*.min.js,**/*.min.css

sonar.cpd.exclusions=**/lang/**,**/database/migrations/**,**/database/seeders/**,**/database/factories/**,**/config/**,**/tests/**,**/resources/views/**,**/app/Http/Resources/**

sonar.coverage.exclusions=bootstrap/**,public/**,app/Console/Commands/ExportApiDocumentation.php,app/Console/Commands/ReleaseCheck.php,app/Http/Controllers/ApiDocumentationController.php,app/Http/Requests/AttendanceReportRequest.php,**/config/**,**/database/migrations/**,**/database/seeders/**,**/database/factories/**,**/lang/**,**/resources/**,**/routes/**,**/app/Http/Resources/**,**/app/Console/Kernel.php,**/app/Exceptions/Handler.php

sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml


sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=php:S5689
sonar.issue.ignore.multicriteria.e1.resourceKey=app/Http/Requests/**
sonar.issue.ignore.multicriteria.e2.ruleKey=php:S5693
sonar.issue.ignore.multicriteria.e2.resourceKey=app/Http/Requests/**
