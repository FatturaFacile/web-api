name: Backend Quality & Merge Gates

on:
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'app/**'
      - 'modules/**'
      - 'database/**'
      - 'config/**'
      - 'tests/**'
      - 'composer.json'
      - 'composer.lock'
      - 'phpstan.neon'
      - '.github/workflows/ci-quality.yml'
  push:
    branches: [main, master]
  schedule:
    # Weekly security audit every Monday at 04:00 UTC
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-static-analysis:
    name: Backend Static Analysis & Architecture Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, pdo_pgsql, xmlreader, redis, bcmath, zip
          coverage: none

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Code Formatter Check
        run: ./vendor/bin/pint --test

      - name: Run PHPStan / Larastan
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Run Pest Architecture Boundary Tests
        run: ./vendor/bin/pest tests/Architecture --no-coverage

  backend-tests:
    name: Backend Pest Tests & Coverage Gate (>=80%)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup PHP with PCOV Coverage Driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, xml, ctype, iconv, intl, pdo, sqlite, pdo_sqlite, pdo_pgsql, xmlreader, redis, bcmath, zip, pcov
          coverage: pcov
          ini-values: memory_limit=10G, max_memory_limit=10G, pcov.directory=${{ github.workspace }}, pcov.exclude="~^(?!${{ github.workspace }}/(app|modules)/).*$~"

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Execute Pest Test Suite in Shards with Coverage Gate
        run: |
          for s in 1 2 3 4; do
            ./vendor/bin/pest --shard=$s/4 --compact --coverage-clover=clover-$s.xml
          done
          python3 scripts/merge-coverage.py --min 70 --output clover.xml clover-*.xml | tee coverage-summary.txt

  security-audit:
    name: Composer Security Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Check for Known Vulnerabilities (composer audit)
        run: composer audit --locked

      - name: Generate Security Report Artifact (Weekly Cron)
        if: github.event_name == 'schedule'
        run: |
          mkdir -p reports
          composer audit --format=json > reports/composer-security-audit.json || true
        continue-on-error: true

      - name: Upload Security Artifact
        if: github.event_name == 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: backend-security-audit-report
          path: reports/composer-security-audit.json
          retention-days: 30
