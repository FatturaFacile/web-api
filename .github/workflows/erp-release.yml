name: Enterprise ERP Production Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup PHP 8.5 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, xmlreader, redis, bcmath

      - name: Install Production Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine Release Tag
        id: vars
        run: |
          RELEASE_TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Release Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }} .
          docker push ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.tag }}

      - name: Publish Release Notes
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
