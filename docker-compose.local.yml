# Services for local development: the API and the frontend run on the host (see README, "Local Development Setup").
# It uses port 5432 like docker-compose.test.yml: run one database at a time.
# The credentials come from the DB_* values of .env, which Docker Compose reads automatically.
name: fatturafacile-local

services:
  postgres:
    image: postgres:16
    container_name: ff-pg
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: ff-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pg_data:
