name: Enterprise ERP CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-and-lint:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fatturafacile_test
          POSTGRES_USER: ff_admin
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup PHP 8.5 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, xmlreader, redis, bcmath
          coverage: pcov

      - name: Validate Composer Configuration
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run Laravel Pint Code Formatter Check
        run: ./vendor/bin/pint --test

      - name: Setup Test Environment & Migrations
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fatturafacile_test
          DB_USERNAME: ff_admin
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

      - name: Run Pest Architecture Boundary Tests
        run: ./vendor/bin/pest tests/Architecture --no-coverage

      - name: Run Foundation Feature Tests
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fatturafacile_test
          DB_USERNAME: ff_admin
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest tests/Feature/Foundation --no-coverage

      - name: Run Pest Test Suite
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: fatturafacile_test
          DB_USERNAME: ff_admin
          DB_PASSWORD: secret_password
          REDIS_HOST: 127.0.0.1
        run: ./vendor/bin/pest --compact
