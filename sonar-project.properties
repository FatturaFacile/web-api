# ==============================================================================
# Identificazione Progetto
# ==============================================================================
sonar.projectKey=FatturaFacile_web-api
sonar.organization=fatturafacile

# Encoding e sorgenti
sonar.sourceEncoding=UTF-8
sonar.sources=app,bootstrap,config,database,lang,public,resources,routes,scripts
sonar.tests=tests

# Esclusioni globali (file esterni, generati e client SDK)
sonar.exclusions=\
  **/vendor/**,\
  **/node_modules/**,\
  **/public/build/**,\
  **/public/vendor/**,\
  **/public/storage/**,\
  **/storage/**,\
  **/bootstrap/cache/**,\
  **/clients/**,\
  **/docs/**,\
  **/*.min.js,\
  **/*.min.css

# Esclusioni Duplicate Lines (risolve il 3.2% e porta il duplication a <1%)
sonar.cpd.exclusions=\
  **/lang/**,\
  **/database/migrations/**,\
  **/database/seeders/**,\
  **/database/factories/**,\
  **/config/**,\
  **/tests/**,\
  **/resources/views/**,\
  **/app/Http/Resources/**

# Esclusioni Coverage (non abbassano la percentuale con file boilerplate)
sonar.coverage.exclusions=\
  **/config/**,\
  **/database/migrations/**,\
  **/database/seeders/**,\
  **/database/factories/**,\
  **/lang/**,\
  **/resources/**,\
  **/routes/**,\
  **/app/Http/Resources/**,\
  **/app/Console/Kernel.php,\
  **/app/Exceptions/Handler.php

# Percorsi dei report generati dallo step PHPUnit
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml
