# SonarCloud / SonarQube Project Configuration
sonar.projectKey=fattura-facile_web-api
sonar.projectName=fattura-facile-web-api

# Source code directories
sonar.sources=app,config,lang,routes
sonar.tests=tests

# Code Duplication (CPD) Exclusions
# Target: Code Duplication <= 3% on New Code
sonar.cpd.exclusions=analisi/**,resources/views/**

# General Exclusions
sonar.exclusions=vendor/**,node_modules/**,storage/**,dockers/**,public/build/**
