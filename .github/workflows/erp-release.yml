name: Enterprise ERP Production Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Publish Release Artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7

      - name: Setup PHP 8.5 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, xmlreader, redis, bcmath

      - name: Install Production Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress

      - name: Build Docker Production Image
        run: |
          docker build -t ghcr.io/${{ github.repository }}:${{ github.ref_name }} .
          docker tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} ghcr.io/${{ github.repository }}:latest

      - name: Publish Release Notes
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
