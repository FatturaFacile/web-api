# ==============================================================================
# Identificazione Progetto
# ==============================================================================
sonar.projectKey=fattura-facile_web-api
sonar.projectName=fattura-facile-web-api
sonar.projectVersion=1.0

# Encoding e sorgenti
sonar.sourceEncoding=UTF-8
sonar.sources=app,bootstrap,config,database,lang,public,resources,routes,scripts
sonar.tests=tests

# ==============================================================================
# Esclusioni Generali dall'Analisi (sonar.exclusions)
# File generati, vendor, build artifact e asset statici
# ==============================================================================
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/build/**,\
  public/vendor/**,\
  public/storage/**,\
  storage/**,\
  bootstrap/cache/**,\
  clients/**,\
  docs/**,\
  *.min.js,\
  *.min.css

# ==============================================================================
# Esclusioni dal Calcolo della Duplicazione (sonar.cpd.exclusions)
# Questi file vengono analizzati per bug/vulnerabilità, MA NON concorrono al % di duplicazione
# ==============================================================================
sonar.cpd.exclusions=\
  lang/**,\
  database/migrations/**,\
  database/seeders/**,\
  database/factories/**,\
  config/**,\
  tests/**,\
  resources/views/**,\
  app/Http/Resources/**

# ==============================================================================
# Esclusioni dal Calcolo del Code Coverage (sonar.coverage.exclusions)
# File strutturali, DTO/Resource, configurazioni o boilerplate non soggetti a unit test
# ==============================================================================
sonar.coverage.exclusions=\
  config/**,\
  database/migrations/**,\
  database/seeders/**,\
  database/factories/**,\
  lang/**,\
  resources/**,\
  routes/**,\
  app/Console/Kernel.php,\
  app/Exceptions/Handler.php,\
  app/Http/Middleware/**,\
  app/Http/Resources/**

# ==============================================================================
# Integrazione Test & Report Coverage PHPUnit (se presenti nella pipeline CI)
# ==============================================================================
sonar.php.coverage.reportPaths=build/logs/clover.xml
sonar.php.tests.reportPath=build/logs/junit.xml
