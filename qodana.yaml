version: "1.0"

linter: jetbrains/qodana-php:2026.2

profile:
  name: qodana.recommended

php:
  version: 8.5

include:
  - name: PhpUndefinedMethodInspection
  - name: PhpUndefinedFieldInspection
  - name: PhpUnusedPrivateMethodInspection
  - name: PhpUnusedPrivateFieldInspection
  - name: PhpUnhandledExceptionInspection
  - name: PhpPossiblePolymorphicInvocationInspection
  - name: PhpRedundantVariableDocTypeInspection
  - name: PhpParamsInspection
  - name: PhpReturnDocTypeMismatchInspection
  - name: PhpArrayShapeCanBeAddedInspection

exclude:
  - name: PhpDuplicateCodeInspection
    paths:
      - analisi
  - name: All
    paths:
      - node_modules
      - vendor
      - storage
      - dockers
  
failureConditions:
  severityThresholds:
    critical: 0
    high: 0
    moderate: 800
    low: 150

  testCoverageThresholds:
    fresh: 90
    total: 85
