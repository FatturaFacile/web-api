# TLS is terminated by the edge proxy (erp_nginx); this server forwards traffic and passes
# through X-Forwarded-Proto so Laravel recognizes secure HTTPS requests from trusted proxies.

# dev.fatturafacile.eu: Angular build + same-origin API (no cross-site cookies)
server {
    listen 80;
    server_name dev.fatturafacile.eu;
    root /srv/fe;
    client_max_body_size 64M;

    location ~ ^/(api|sanctum|docs|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass ffdev_app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_FOR $http_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_x_forwarded_host;
        fastcgi_param HTTP_X_FORWARDED_PORT $http_x_forwarded_port;
        fastcgi_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

