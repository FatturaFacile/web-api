# Try FatturaFacile locally from the published image. No build, no Composer, no vendor/ folder needed.
#
#   cp deploy/local/env.example deploy/local/.env
#   docker compose -f deploy/local/compose.yaml up -d --wait
#   docker compose -f deploy/local/compose.yaml exec app php artisan migrate --force
#   docker compose -f deploy/local/compose.yaml exec app php artisan erp:bootstrap
#
# API on http://localhost:8000 (override with API_PORT in deploy/local/.env). Everything listens on 127.0.0.1 only.
# Not for production: see docker-compose.yml and deploy/dev for the real stacks.
name: fatturafacile-demo

x-app: &app
  # Pinned tag. To use another release, change it here and in README.md (tags: https://hub.docker.com/r/fatturafacile/api).
  image: docker.io/fatturafacile/api:0.1.2
  env_file: .env
  environment:
    APP_ENV: local
    APP_DEBUG: "false"
    TELESCOPE_ENABLED: "false"
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: "5432"
    # The published image has no PHP Redis extension: cache, session and queue use the database.
    CACHE_STORE: database
    SESSION_DRIVER: database
    QUEUE_CONNECTION: sync
    MAIL_MAILER: log
    LOG_CHANNEL: stderr
  volumes:
    - app_storage:/var/www/html/storage
  depends_on:
    postgres:
      condition: service_healthy

services:
  app:
    <<: *app
    # The image only runs php-fpm. If APP_KEY is empty, a key is generated on first start and kept in the storage volume.
    command:
      - sh
      - -c
      - |
        if [ -z "$$APP_KEY" ]; then
          [ -s storage/.app_key ] || php artisan key:generate --show > storage/.app_key
          export APP_KEY="$$(cat storage/.app_key)"
        fi
        mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs storage/api-docs
        php artisan config:cache && php artisan route:cache && php artisan view:cache && php artisan l5-swagger:generate
        exec php-fpm
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 && test -f /var/www/html/bootstrap/cache/config.php"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1:${API_PORT:-8000}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  app_storage:
  pg_data:
