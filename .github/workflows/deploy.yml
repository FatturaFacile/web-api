name: Build, Publish and Deploy

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,enable=true,priority=100

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            cd ~/api.fatturafacile.eu

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull app queue_worker scheduler

            docker compose stop queue_worker scheduler || true

            docker compose stop postgres
            docker compose rm -f -v postgres

            docker compose up -d postgres app

            echo "Attesa che PostgreSQL sia pronto ad accettare connessioni..."
            RETRIES=30
            until docker compose exec -T postgres pg_isready -h localhost || [ $RETRIES -eq 0 ]; do
              echo "In attesa di Postgres ($RETRIES tentativi rimasti)..."
              sleep 2
              RETRIES=$((RETRIES-1))
            done

            if [ $RETRIES -eq 0 ]; then
              echo "Timeout: PostgreSQL non risponde."
              exit 1
            fi

            docker compose exec -T app php artisan config:clear
            docker compose exec -T app php artisan cache:clear

            docker compose exec -T app php -d memory_limit=512M artisan migrate:fresh --seed --force

            docker compose exec -T app php artisan config:cache
            docker compose exec -T app php artisan route:cache
            docker compose exec -T app php artisan view:cache
            docker compose exec -T app php -d memory_limit=512M artisan l5-swagger:generate

            docker compose up -d queue_worker scheduler

            docker image prune -af --filter "until=24h"
