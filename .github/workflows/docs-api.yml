name: Regenerate API docs

# Regenerates the OpenAPI / Postman files (docs/api) after every push to dev and commits them back, so nobody has to do it
# locally (there is no pre-push hook for it anymore). The commit is made with GITHUB_TOKEN, which never triggers another
# workflow run, and it only touches docs/api, so there is no loop.
on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'docs/api/**'
  workflow_dispatch:

concurrency:
  group: docs-api-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    name: Export OpenAPI and commit
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Setup PHP 8.5 Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo_pgsql, xmlreader, redis, bcmath
          coverage: none
          ini-values: memory_limit=2G
          tools: composer:v2

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Export the documentation
        run: |
          cp .env.example .env
          php artisan key:generate
          php -d memory_limit=2048M artisan docs:export

      - name: Commit the regenerated files
        run: |
          if git diff --quiet -- docs/api; then
            echo "docs/api is up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/api
          git commit -m "docs: regenerate OpenAPI [skip ci]"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
