# TLS is terminated by erp_nginx; this server only sees plain HTTP from it. HTTPS is signalled by the X-Forwarded-Proto
# header (passed to php-fpm as HTTP_X_FORWARDED_PROTO), honoured only from the proxies in TRUSTED_PROXIES (.env).

# dev.fatturafacile.eu: Angular build + same-origin API (no cross-site cookies)
server {
    listen 80;
    server_name dev.fatturafacile.eu;
    root /srv/fe;
    client_max_body_size 64M;

    location ~ ^/(api|sanctum|docs|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass ffdev_app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# inglorious.fatturafacile.eu: Inglorious frontend (web-frontend-inglorious) + same-origin dev API
server {
    listen 80;
    server_name inglorious.fatturafacile.eu;
    root /srv/inglorious;
    client_max_body_size 64M;

    location ~ ^/(api|sanctum|up)(/|$) {
        include fastcgi_params;
        fastcgi_pass ffdev_app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# dev-api.fatturafacile.eu: API only (Swagger, tools)
server {
    listen 80 default_server;
    server_name dev-api.fatturafacile.eu;
    client_max_body_size 64M;

    location / {
        include fastcgi_params;
        fastcgi_pass ffdev_app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_read_timeout 300s;
    }
}
